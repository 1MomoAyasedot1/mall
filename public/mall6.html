<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛒 优选商城 - 在线购物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        .header {
            background: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            color: #ff6b35;
        }
        .logo small {
            font-size: 13px;
            font-weight: 400;
            color: #999;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .user-name {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .btn {
            padding: 6px 18px;
            border-radius: 20px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-primary {
            background: #ff6b35;
            color: #fff;
        }
        .btn-primary:hover {
            background: #e55a2b;
        }
        .btn-outline {
            background: transparent;
            color: #ff6b35;
            border: 1.5px solid #ff6b35;
        }
        .btn-outline:hover {
            background: #ff6b35;
            color: #fff;
        }
        .btn-danger-outline {
            background: transparent;
            color: #e74c3c;
            border: 1.5px solid #e74c3c;
        }
        .btn-danger-outline:hover {
            background: #e74c3c;
            color: #fff;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 16px;
        }
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }
        .banner {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 40px 50px;
            color: #fff;
            margin-bottom: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .banner h2 {
            font-size: 28px;
            font-weight: 700;
        }
        .banner h2 span {
            color: #ffd700;
        }
        .banner p {
            opacity: 0.8;
            margin-top: 6px;
            font-size: 15px;
        }
        .banner .btn-banner {
            background: #ffd700;
            color: #1a1a2e;
            padding: 12px 36px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .banner .btn-banner:hover {
            transform: scale(1.05);
        }
        .promotion-section {
            margin-bottom: 30px;
        }
        .promotion-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }
        .promotion-card {
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: relative;
        }
        .promotion-card:hover {
            transform: translateY(-4px);
        }
        .promotion-card span {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }
        .promotion-card div {
            font-size: 14px;
            font-weight: 600;
        }
        .promotion-card small {
            font-size: 11px;
            opacity: 0.85;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-header h3 {
            font-size: 22px;
            color: #1a1a2e;
        }
        .section-header h3 span {
            color: #ff6b35;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }
        .product-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
        }
        .product-card .img {
            height: 180px;
            background: linear-gradient(135deg, #f0f2f5, #e8ecf1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #999;
        }
        .product-card .info {
            padding: 16px 18px 20px;
        }
        .product-card .info .name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 44px;
        }
        .product-card .info .brand {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }
        .product-card .info .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }
        .product-card .info .price {
            font-size: 22px;
            font-weight: 800;
            color: #e74c3c;
        }
        .product-card .info .price small {
            font-size: 14px;
            font-weight: 400;
        }
        .product-card .info .btn-cart {
            background: #ff6b35;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .product-card .info .btn-cart:hover {
            background: #e55a2b;
        }
        .product-card .info .btn-cart:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .cart-float {
            position: fixed;
            right: 30px;
            bottom: 100px;
            background: #1a1a2e;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 50;
            transition: transform 0.2s;
        }
        .cart-float:hover {
            transform: scale(1.08);
        }
        .cart-float .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e74c3c;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px 32px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            width: 440px;
        }
        .modal-wide {
            width: 520px;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 700;
        }
        .modal-header .close {
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
            background: none;
            border: none;
        }
        .modal-header .close:hover {
            color: #333;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .modal .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        .modal .form-group input:focus {
            border-color: #ff6b35;
        }
        .modal .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .modal .btn-submit:hover {
            background: #e55a2b;
        }
        .modal .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border: 1px solid #f0f2f5;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #fafafa;
            transition: background 0.2s;
            flex-wrap: wrap;
            gap: 8px;
        }
        .list-item:hover {
            background: #f0f9eb;
        }
        .list-item .info {
            flex: 1;
            min-width: 150px;
        }
        .list-item .info .name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .list-item .info .desc {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .list-item .info .desc span {
            color: #e74c3c;
            font-weight: 600;
        }
        .list-item .tag {
            background: #ff6b35;
            color: #fff;
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .list-item .tag.green {
            background: #52c41a;
        }
        .list-item .tag.blue {
            background: #409eff;
        }
        .list-item .tag.gold {
            background: #ffd700;
            color: #1a1a2e;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .cart-item .name {
            flex: 1;
            font-size: 14px;
        }
        .cart-item .qty {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 10px;
        }
        .cart-item .qty button {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }
        .cart-item .qty button:hover {
            background: #f0f2f5;
        }
        .cart-item .qty span {
            min-width: 18px;
            text-align: center;
            font-weight: 600;
        }
        .cart-item .subtotal {
            font-weight: 700;
            color: #e74c3c;
            font-size: 14px;
            min-width: 60px;
            text-align: right;
        }
        .cart-item .remove {
            color: #e74c3c;
            cursor: pointer;
            font-size: 18px;
            background: none;
            border: none;
            margin-left: 4px;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            padding: 14px 0;
            border-top: 2px solid #f0f2f5;
            margin-top: 8px;
        }
        .cart-total .amount {
            color: #e74c3c;
            font-size: 22px;
        }
        .btn-checkout {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-checkout:hover {
            transform: scale(1.02);
        }
        .btn-checkout:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .empty-text {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-size: 16px;
        }
        .text-center {
            text-align: center;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .link {
            color: #ff6b35;
            cursor: pointer;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        .toast.success {
            background: #52c41a;
            color: #fff;
        }
        .toast.error {
            background: #ff4d4f;
            color: #fff;
        }
        .toast.info {
            background: #409eff;
            color: #fff;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 768px) {
            .promotion-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 640px) {
            .header-inner {
                height: 58px;
                padding: 0 12px;
            }
            .logo {
                font-size: 20px;
            }
            .logo small {
                display: none;
            }
            .header-actions .user-name {
                font-size: 13px;
            }
            .btn {
                padding: 4px 12px;
                font-size: 12px;
            }
            .banner {
                padding: 24px 20px;
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }
            .banner h2 {
                font-size: 20px;
            }
            .promotion-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .promotion-card {
                padding: 10px 6px;
            }
            .promotion-card span {
                font-size: 20px;
            }
            .promotion-card div {
                font-size: 12px;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .product-card .img {
                height: 120px;
                font-size: 28px;
            }
            .product-card .info {
                padding: 12px 14px 16px;
            }
            .product-card .info .name {
                font-size: 13px;
                height: 38px;
            }
            .product-card .info .price {
                font-size: 18px;
            }
            .modal {
                width: 94%;
                padding: 20px 16px;
            }
            .modal-wide {
                width: 94%;
            }
            .cart-float {
                right: 16px;
                bottom: 80px;
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .list-item {
                flex-direction: column;
                align-items: stretch;
            }
            .list-item .info {
                min-width: auto;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                🛒 优选<span>商城</span>
                <small>· 品质生活</small>
            </div>
            <div class="header-actions">
                <span class="user-name" id="userDisplay">👤 游客</span>
                <button class="btn btn-outline" id="myOrderBtn" style="display:none" onclick="showMyOrders()">我的订单</button>
                <button class="btn btn-primary" id="loginBtn" onclick="showLogin()">登录</button>
                <button class="btn btn-danger-outline" id="logoutBtn" style="display:none" onclick="logout()">退出</button>
            </div>
        </div>
    </header>

    <div class="main">

        <div class="banner">
            <div>
                <h2>🔥 热卖爆款 · <span>限时特惠</span></h2>
                <p>全场数码产品 · 品质保障 · 正品低价</p>
            </div>
            <button class="btn-banner" onclick="document.querySelector('.product-grid').scrollIntoView({behavior:'smooth'})">
                立即抢购 →
            </button>
        </div>

        <div class="promotion-section">
            <div class="promotion-grid">
                <div class="promotion-card" style="background:#ff6b35;" onclick="showFlashList()">
                    <span>⚡</span>
                    <div>秒杀活动</div>
                    <small>限时抢购</small>
                </div>
                <div class="promotion-card" style="background:#ffd700;color:#1a1a2e;" onclick="showCouponList()">
                    <span>🎫</span>
                    <div>优惠券</div>
                    <small>领取优惠</small>
                </div>
                <div class="promotion-card" style="background:#409eff;" onclick="showBrandList()">
                    <span>🏷️</span>
                    <div>品牌推荐</div>
                    <small>品质保证</small>
                </div>
                <div class="promotion-card" style="background:#52c41a;" onclick="showNewList()">
                    <span>🆕</span>
                    <div>新品推荐</div>
                    <small>最新上架</small>
                </div>
                <div class="promotion-card" style="background:#e74c3c;" onclick="showHotList()">
                    <span>🔥</span>
                    <div>人气推荐</div>
                    <small>热卖爆款</small>
                </div>
                <div class="promotion-card" style="background:#9b59b6;" onclick="showSubjectList()">
                    <span>📌</span>
                    <div>专题推荐</div>
                    <small>精选专题</small>
                </div>
                <div class="promotion-card" style="background:#1abc9c;" onclick="showAdvertiseList()">
                    <span>📢</span>
                    <div>广告列表</div>
                    <small>品牌推广</small>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h3>✨ 热门<span>商品</span></h3>
        </div>
        <div class="product-grid" id="productGrid">
        </div>
    </div>

    <button class="cart-float" onclick="toggleCart()">
        🛒
        <span class="badge" id="cartBadge" style="display:none">0</span>
    </button>

    <div id="cartModal" class="modal-overlay" onclick="if(event.target===this) toggleCart()">
        <div class="modal modal-wide">
            <div class="modal-header">
                🛒 购物车
                <button class="close" onclick="toggleCart()">✕</button>
            </div>
            <div id="cartList">
                <div class="empty-text">🛍️ 购物车是空的</div>
            </div>
            <div id="cartFooter" style="display:none">
                <div class="cart-total">
                    <span>合计</span>
                    <span class="amount" id="cartTotal">¥0.00</span>
                </div>
                <button class="btn-checkout" id="checkoutBtn" onclick="checkout()">立即下单</button>
            </div>
        </div>
    </div>

    <div id="listModal" class="modal-overlay" onclick="if(event.target===this) closeListModal()">
        <div class="modal modal-wide">
            <div class="modal-header">
                <span id="listModalTitle">📋 列表</span>
                <button class="close" onclick="closeListModal()">✕</button>
            </div>
            <div id="listModalContent">
                <div class="empty-text">暂无数据</div>
            </div>
        </div>
    </div>

    <div id="orderModal" class="modal-overlay" onclick="if(event.target===this) closeOrderModal()">
        <div class="modal modal-wide">
            <div class="modal-header">
                📦 我的订单
                <button class="close" onclick="closeOrderModal()">✕</button>
            </div>
            <div id="orderListContent">
                <div class="empty-text">暂无订单</div>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal-overlay" onclick="if(event.target===this) hideLogin()">
        <div class="modal">
            <div class="modal-header">
                🔐 用户登录
                <button class="close" onclick="hideLogin()">✕</button>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input id="loginUsername" type="text" placeholder="请输入用户名" value="admin" />
            </div>
            <div class="form-group">
                <label>密码</label>
                <input id="loginPassword" type="password" placeholder="请输入密码" value="123456" />
            </div>
            <button class="btn-submit" id="loginSubmit" onclick="handleLogin()">登 录</button>
            <div class="text-center mt-12">
                <span style="color:#999;font-size:13px;">还没有账号？</span>
                <span class="link" onclick="showRegister()">立即注册</span>
            </div>
        </div>
    </div>

    <div id="registerModal" class="modal-overlay" onclick="if(event.target===this) hideRegister()">
        <div class="modal">
            <div class="modal-header">
                📝 用户注册
                <button class="close" onclick="hideRegister()">✕</button>
            </div>
            <div class="form-group">
                <label>用户名</label>

        // ===== 格式化时间：YYYY-MM-DD HH:mm:ss =====
        function formatTime(dateStr) {
            if (!dateStr) return '';
            try {
                var d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                var year = d.getFullYear();
                var month = ('0' + (d.getMonth() + 1)).slice(-2);
                var day = ('0' + d.getDate()).slice(-2);
                var hours = ('0' + d.getHours()).slice(-2);
                var minutes = ('0' + d.getMinutes()).slice(-2);
                var seconds = ('0' + d.getSeconds()).slice(-2);
                return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
            } catch (e) {
                return dateStr;
            }
        }

        async function handleLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) {
                showToast('请输入用户名和密码', 'error');
                return;
            }
            var btn = document.getElementById('loginSubmit');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 登录中...';
            try {
                var res = await fetch(API + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();
                if (data.code === 200) {
                    currentToken = data.data.token;
                    currentUser = username;
                    localStorage.setItem('mallUser', username);
                    localStorage.setItem('mallToken', currentToken);
                    updateUI();
                    hideLogin();
                    showToast('✅ 欢迎回来，' + username + '！', 'success');
                } else {
                    showToast('❌ ' + (data.message || '登录失败'), 'error');
                }
            } catch (e) {

            } finally {
                btn.disabled = false;
                btn.innerHTML = '登 录';
            }
        }

        function getIcon(name) {
            if (name.indexOf('手机') !== -1 || name.indexOf('iPhone') !== -1 || name.indexOf('华为') !== -1 || name.indexOf('小米') !== -
                1)
                return '📱';
            if (name.indexOf('电视') !== -1) return '📺';
            if (name.indexOf('平板') !== -1 || name.indexOf('iPad') !== -1) return '📟';
            if (name.indexOf('笔记本') !== -1 || name.indexOf('Book') !== -1 || name.indexOf('电脑') !== -1) return '💻';
            if (name.indexOf('耳机') !== -1 || name.indexOf('音响') !== -1) return '🎧';
            if (name.indexOf('手表') !== -1) return '⌚';
            if (name.indexOf('相机') !== -1) return '📷';
            if (name.indexOf('硬盘') !== -1 || name.indexOf('SSD') !== -1) return '💾';
            if (name.indexOf('燃气热水器') !== -1) return '🔥';
            if (name.indexOf('鞋') !== -1) return '👟';
            return '📦';
        }

        function addToCart(id) {
            if (!currentUser) {
                showToast('请先登录', 'error');
                showLogin();
                return;
            }
            var p = null;
            for (var i = 0; i < products.length; i++) {
                if (products[i].id === id) { p = products[i]; break; }
            }
            if (!p) return;
            var exist = null;
            for (var j = 0; j < cart.length; j++) {
                if (cart[j].id === id) { exist = cart[j]; break; }
            }
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ id: p.id, name: p.name, price: p.price, brandName: p.brandName, qty: 1 });
            }
            showToast('✅ 已加入购物车：' + p.name, 'success');
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateQty(index, delta) {
            var item = cart[index];
            item.qty += delta;
            if (item.qty <= 0) cart.splice(index, 1);
            updateCartUI();
        }

        function getCartCount() {
            var count = 0;
            for (var i = 0; i < cart.length; i++) {
                count += cart[i].qty;
            }
            return count;
        }

        function getCartTotal() {
            var total = 0;
            for (var i = 0; i < cart.length; i++) {
                total += cart[i].price * cart[i].qty;
            }
            return total;
        }

        function updateCartUI() {
            var count = getCartCount();
            if (count > 0) {
                cartBadge.textContent = count;

                cartFooter.style.display = 'none';
                checkoutBtn.disabled = true;

            var html = '';
            for (var i = 0; i < cart.length; i++) {
                var item = cart[i];
                html += '<div class="cart-item">';
                html += '<span class="name">' + getIcon(item.name) + ' ' + item.name + '</span>';
                html += '<div class="qty">';
                html += '<button onclick="updateQty(' + i + ', -1)">−</button>';
                html += '<span>' + item.qty + '</span>';
                html += '<button onclick="updateQty(' + i + ', 1)">+</button>';
                html += '</div>';
                html += '<span class="subtotal">¥' + (item.price * item.qty).toFixed(2) + '</span>';
                html += '<button class="remove" onclick="removeFromCart(' + i + ')">✕</button>';
                html += '</div>';
            }
            cartList.innerHTML = html;
            cartTotal.textContent = '¥' + getCartTotal().toFixed(2);
            cartFooter.style.display = 'block';
            checkoutBtn.disabled = false;
        }

                // 按创建时间倒序排列（最新的在前面）
                data.sort(function(a, b) {
                    return new Date(b.createTime) - new Date(a.createTime);
                });

                console.log('订单数量:', data.length);
                if (data.length > 0) {
                    console.log('最新订单:', data[0]);
                }

                if (data && data.length > 0) {
                    var html = '';
                    for (var i = 0; i < data.length; i++) {
                        var item = data[i];
                        var statusMap = {
                            0: '⏳ 待付款',
                            1: '📦 待发货',
                            2: '🚚 已发货',
                            3: '✅ 已完成',
                            4: '❌ 已关闭'
                        };
                        var statusText = statusMap[item.status] || '未知状态';
                        var createTime = formatTime(item.createTime);
                        html += '<div class="list-item">';
                        html += '<div class="info">';
                        html += '<div class="name">订单号: ' + (item.orderSn || '') + '</div>';
                        html += '<div class="desc">金额: ¥' + (item.totalAmount || 0) + ' · ' + statusText + ' · ' + createTime +
                            '</div>';
                        html += '</div>';
                        if (item.status === 0) {
                            html +=
                                '<button class="btn btn-primary btn-sm" onclick="payOrderBtn(' + item.id + ')">立即付款</button>';
                        } else if (item.status === 1) {
                            html += '<span class="tag" style="background:#ff6b35;color:#fff;">待发货</span>';
                        } else if (item.status === 2) {
                            html +=
                                '<button class="btn btn-primary btn-sm" onclick="confirmReceive(' + item.id + ')">确认收货</button>';
                        } else if (item.status === 3) {
                            html += '<span class="tag green">已完成</span>';
                        } else if (item.status === 4) {
                            html += '<span class="tag" style="background:#999;color:#fff;">已关闭</span>';
                        }
                        html += '</div>';
                    }
                    document.getElementById('orderListContent').innerHTML = html;
                    document.getElementById('orderModal').classList.add('active');
                } else {
                    document.getElementById('orderListContent').innerHTML =
                        '<div class="empty-text">暂无订单，快去购物吧！</div>';
                    document.getElementById('orderModal').classList.add('active');
                }
            } catch (e) {
                console.error('加载订单失败:', e);
                document.getElementById('orderListContent').innerHTML = '<div class="empty-text">加载失败</div>';
                document.getElementById('orderModal').classList.add('active');
            }
        }

        // ===== 从我的订单中付款 =====
        async function payOrderBtn(orderId) {
            if (confirm('确认支付该订单吗？')) {
                await payOrder(orderId);
                showMyOrders();
            }
        }

        // ===== 确认收货 =====
        async function confirmReceive(orderId) {
            if (confirm('确认已收到商品？')) {
                try {
                    var res = await fetch(API + '/order/confirm/' + orderId, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + currentToken }
                    });
                    var data = await res.json();
                    if (data.code === 200) {
                        showToast('✅ 确认收货成功！', 'success');
                        showMyOrders();
                    } else {
                        showToast('❌ 操作失败', 'error');
                    }
                } catch (e) {
                    showToast('❌ 网络异常', 'error');
                }
            }
        }

        // ===== 付款 =====
        async function payOrder(orderId) {
            try {
                var res = await fetch(API + '/order/pay/' + orderId, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + currentToken }
                });
                var data = await res.json();
                if (data.code === 200) {
                    showToast('✅ 付款成功！订单状态：待发货', 'success');
                    return true;
                } else {
                    showToast('❌ 付款失败：' + (data.message || '未知错误'), 'error');
                    return false;
                }
            } catch (e) {
                showToast('❌ 付款网络异常', 'error');
                return false;
            }
        }

        // ===== 下单 =====
        async function checkout() {
            if (!currentUser) {
                showToast('请先登录', 'error');
                showLogin();
                return;
            }
            if (cart.length === 0) {
                showToast('购物车是空的', 'error');
                return;
            }
            var item = cart[0];
            checkoutBtn.disabled = true;
            checkoutBtn.innerHTML = '<span class="spinner"></span> 下单中...';
            try {
                var res = await fetch(API + '/order/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + currentToken
                    },
                    body: JSON.stringify({
                        memberId: 1,
                        productId: item.id,
                        quantity: item.qty,
                        productPrice: item.price,
                        receiverProvince: '广东省',
                        receiverCity: '深圳市',
                        receiverRegion: '南山区',
                        receiverDetailAddress: '科技园南区123号',
                        receiverName: currentUser || '用户',
                        receiverPhone: '13900139000'
                    })
                });
                var data = await res.json();
                if (data.code === 200) {
                    var orderId = data.data;
                    showToast('🎉 下单成功！', 'success');
                    cart = [];
                    updateCartUI();
                    toggleCart();
                    if (confirm('订单已创建，是否立即付款？')) {
                        await payOrder(orderId);
                    }
                } else {
                    showToast('❌ ' + (data.message || '下单失败'), 'error');
                }
            } catch (e) {
                showToast('❌ 网络异常，请检查后端服务', 'error');
            } finally {
                checkoutBtn.disabled = false;
                checkoutBtn.innerHTML = '立即下单';
            }
        }

        function init() {
            var savedUser = localStorage.getItem('mallUser');
            var savedToken = localStorage.getItem('mallToken');
            if (savedUser && savedToken) {
                currentUser = savedUser;
                currentToken = savedToken;
            }
            updateUI();
            loadProducts();
            document.getElementById('loginPassword').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('regPassword').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleRegister();
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
